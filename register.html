<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register New User</title>
  <link rel="stylesheet" href="register.css">
  <!-- Add Font Awesome for eye icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Create New Account</h1>
      <div class="header-actions">
        <button class="menu-btn" onclick="toggleMenu()">☰ Menu</button>
        <div class="dropdown-menu" id="dropdownMenu">
          <button class="menu-item" onclick="goToAdmin()">
            Leave
          </button>
          <button class="menu-item" onclick="goToDashboard()">
            Dashboard
          </button>
          <button class="menu-item" onclick="goToLeaveForm()">
            Leave Form
          </button>
          <button class="menu-item" onclick="goToSchedule()">
            Schedule
          </button>
          <button class="menu-item" onclick="viewProfile()">
            <span class="menu-icon">👤</span>
            Profile
          </button>
          <button class="menu-item" onclick="logout()">
            Logout
          </button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="form-intro">
        <p>Register new employees with their details. All fields are required.</p>
      </div>

      <form id="registerForm" class="register-form">
        <div class="form-grid">
          <!-- Username -->
          <div class="form-group">
            <label for="regUsername">
              Username *
              <span class="info-tooltip" title="Must be unique. Used for login">ℹ️</span>
            </label>
            <input id="regUsername" type="text" placeholder="Enter unique username" required>
            <div class="error-message" id="usernameError"></div>
            <div class="availability-status" id="usernameStatus"></div>
          </div>

          <!-- Full Name -->
          <div class="form-group">
            <label for="regName">Full Name *</label>
            <input id="regName" type="text" placeholder="Enter full legal name" required>
            <div class="error-message" id="nameError"></div>
          </div>

          <!-- Department -->
          <div class="form-group">
            <label for="regDepartment">Department *</label>
            <select id="regDepartment" required>
              <option value="">Select Department</option>
              <option value="Operation">Operation</option>
              <option value="Finance">Finance</option>
              <option value="Admin">Admin</option>
              <option value="Utility">Utility</option>
              <option value="Marketing">Marketing</option>
              <option value="Management">Management</option>
              <option value="HR">Human Resources</option>
              <option value="IT">Information Technology</option>
              <option value="Other">Other</option>
            </select>
            <div class="error-message" id="departmentError"></div>
          </div>

          <!-- Date Hired -->
          <div class="form-group">
            <label for="regHired">Date Hired *</label>
            <input id="regHired" type="date" required>
            <div class="error-message" id="hiredError"></div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="regEmail">Email Address *</label>
            <input id="regEmail" type="email" placeholder="employee@company.com" required>
            <!-- ADDED: Email feedback element -->
            <div id="emailFeedback" class="email-feedback"></div>
            <div class="error-message" id="emailError"></div>
            <div class="availability-status" id="emailStatus"></div>
          </div>

          <!-- Password - UPDATED with proper toggle -->
          <div class="form-group">
            <label for="regPassword">
              Password *
              <span class="info-tooltip" title="Minimum 8 characters with uppercase, lowercase, number and special character">ℹ️</span>
            </label>
            <!-- UPDATED: Password container with proper toggle -->
            <div class="password-input-container">
              <input id="regPassword" type="password" placeholder="Create secure password" required>
              <button type="button" class="password-toggle" id="passwordToggle">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="error-message" id="passwordError"></div>
            <!-- UPDATED: Password strength indicator -->
            <div class="password-strength">
              <div id="passwordStrength" class="strength-text"></div>
              <div class="strength-bar">
                <div class="strength-fill" id="strengthBar"></div>
              </div>
            </div>
          </div>

          <!-- Role -->
          <div class="form-group">
            <label for="regRole">User Role *</label>
            <select id="regRole" required>
              <option value="user">Regular User</option>
              <option value="admin">Administrator</option>
              <option value="approver">Leave Approver</option>
              <option value="manager">Department Manager</option>
            </select>
            <div class="role-description" id="roleDescription">
              Can submit leave requests and view own schedule
            </div>
          </div>
        </div>

        <!-- Terms Agreement -->
        <div class="form-group full-width">
          <label class="checkbox-label">
            <input type="checkbox" id="agreeTerms" required>
            <span class="checkmark"></span>
            I confirm that this employee information is accurate and authorized for system access
          </label>
          <div class="error-message" id="termsError"></div>
        </div>

        <!-- Form Actions -->
        <div class="form-actions">
          <button type="submit" class="submit-btn" id="submitBtn">
            <span class="btn-text">👤 Create Account</span>
            <span class="btn-loading" style="display: none;">⏳ Creating...</span>
          </button>
          <button type="button" class="clear-btn" onclick="clearForm()">🗑️ Clear Form</button>
          <button type="button" class="test-btn" onclick="fillTestData()">🧪 Test Data</button>
        </div>
      </form>

      <!-- Result Message -->
      <div id="regResult" class="result-message"></div>
    </div>

    <!-- Recently Added Users -->
    <div class="recent-users" id="recentUsers" style="display: none;">
      <h3>Recently Registered Users</h3>
      <div class="users-list" id="usersList">
        <!-- Users will be populated here -->
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="stats" id="statsContainer">
      <!-- Stats will be populated here -->
    </div>
  </div>

  <script type="module" src="firebase-init.js"></script>
  <script src="register.js"></script>
</body>
</html>
